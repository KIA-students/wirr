name: Jednorazowe scalenie publicznego WiRR 1.0.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/merge-kia-release-once.yml'

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sprawdź i scal publiczny Pull Request
        env:
          GH_TOKEN: ${{ secrets.KIA_STUDENTS_SYNC_TOKEN }}
          REPO: KIA-students/wirr
          PR: "29"
          EXPECTED_HEAD: cda3e9d1b8b5906c68e314ee47485fd6413a2bfd
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN}"

          head_sha="$(gh pr view "${PR}" --repo "${REPO}" --json headRefOid --jq .headRefOid)"
          if [ "${head_sha}" != "${EXPECTED_HEAD}" ]; then
            echo "::error::Head PR #${PR} zmienił się: ${head_sha}"
            exit 1
          fi

          state="$(gh pr view "${PR}" --repo "${REPO}" --json state --jq .state)"
          if [ "${state}" != "OPEN" ]; then
            echo "PR #${PR} nie jest otwarty: ${state}"
            exit 0
          fi

          failing="$(
            gh pr checks "${PR}" --repo "${REPO}" --json state --jq '[.[] | select(.state != "SUCCESS" and .state != "SKIPPED" and .state != "NEUTRAL")] | length'
          )"
          if [ "${failing}" != "0" ]; then
            echo "::error::PR #${PR} nie ma kompletu zakończonych kontroli."
            gh pr checks "${PR}" --repo "${REPO}" || true
            exit 1
          fi

          gh pr merge "${PR}" --repo "${REPO}" --squash --subject "Release WiRR 1.0.0" --body "Publikacja stabilnego WiRR 1.0.0 po audycie polskich materiałów i finalizacji XR/MR/Mobile AR."
