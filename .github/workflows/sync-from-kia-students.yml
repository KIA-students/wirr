name: Aktualizacja forka z KIA-students

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wirr-sync-from-kia-students
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: KIA-students/wirr
  UPSTREAM_BRANCH: main
  FALLBACK_BRANCH: sync/upstream-main

jobs:
  sync:
    name: Scal nowe zmiany z repozytorium nadrzędnego
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Pobierz fork z pełną historią
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Skonfiguruj Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

      - name: Sprawdź, czy KIA-students/wirr ma nowe commity
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          local_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"
          upstream_only="$(git rev-list --count "HEAD..upstream/${UPSTREAM_BRANCH}")"
          local_only="$(git rev-list --count "upstream/${UPSTREAM_BRANCH}..HEAD")"

          {
            echo "local_sha=${local_sha}"
            echo "upstream_sha=${upstream_sha}"
            echo "upstream_only=${upstream_only}"
            echo "local_only=${local_only}"
          } >> "${GITHUB_OUTPUT}"

          if [ "${upstream_only}" -gt 0 ]; then
            echo "needs_sync=true" >> "${GITHUB_OUTPUT}"
          else
            echo "needs_sync=false" >> "${GITHUB_OUTPUT}"
          fi

          {
            echo "## Synchronizacja z KIA-students/wirr"
            echo
            echo "- fork: `${local_sha:0:12}`"
            echo "- upstream: `${upstream_sha:0:12}`"
            echo "- nowych commitów w upstream: **${upstream_only}**"
            echo "- commitów lokalnych niewystępujących w upstream: **${local_only}**"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Brak zmian do pobrania
        if: steps.compare.outputs.needs_sync != 'true'
        shell: bash
        run: |
          echo "KIA-students/wirr nie zawiera nowych commitów względem forka."
          echo >> "${GITHUB_STEP_SUMMARY}"
          echo "Fork jest aktualny względem repozytorium nadrzędnego." >> "${GITHUB_STEP_SUMMARY}"

      - name: Scal upstream z zachowaniem lokalnej historii
        if: steps.compare.outputs.needs_sync == 'true'
        id: merge
        shell: bash
        run: |
          set -euo pipefail

          # Zwykły merge zachowuje zarówno commity z forka, jak i z upstream.
          # Nie używamy reset --hard, force-push ani strategii nadpisującej historię.
          set +e
          git merge --no-edit "upstream/${UPSTREAM_BRANCH}"
          merge_status=$?
          set -e

          if [ "${merge_status}" -eq 0 ]; then
            echo "clean=true" >> "${GITHUB_OUTPUT}"
            echo "Scalanie zakończone bez konfliktów."
          else
            git merge --abort || true
            echo "clean=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Automatyczne scalanie wykryło konflikt. Główna gałąź forka nie została zmieniona."
          fi

      - name: Zaktualizuj main forka
        if: steps.compare.outputs.needs_sync == 'true' && steps.merge.outputs.clean == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main
          echo >> "${GITHUB_STEP_SUMMARY}"
          echo "✅ `MatPomGit/wirr:main` został zaktualizowany przez bezpieczne scalenie z `KIA-students/wirr:main`." >> "${GITHUB_STEP_SUMMARY}"

      - name: Przygotuj gałąź do ręcznego rozwiązania konfliktu
        if: steps.compare.outputs.needs_sync == 'true' && steps.merge.outputs.clean == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin "upstream/${UPSTREAM_BRANCH}:refs/heads/${FALLBACK_BRANCH}"

      - name: Utwórz lub pokaż PR przy konflikcie
        if: steps.compare.outputs.needs_sync == 'true' && steps.merge.outputs.clean == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          existing="$(
            gh pr list               --repo "${GITHUB_REPOSITORY}"               --state open               --base main               --head "${FALLBACK_BRANCH}"               --json url               --jq '.[0].url // ""'
          )"

          if [ -n "${existing}" ]; then
            pr_url="${existing}"
          else
            pr_url="$(
              gh pr create                 --repo "${GITHUB_REPOSITORY}"                 --base main                 --head "${FALLBACK_BRANCH}"                 --title "sync: KIA-students/wirr → MatPomGit/wirr"                 --body "Automatyczna synchronizacja wykryła nowe commity w `KIA-students/wirr`, ale zwykły merge z `MatPomGit/wirr:main` zakończył się konfliktem. Ten PR udostępnia aktualny stan upstream do ręcznego scalenia. Nie wykonano resetu ani force-push na `main`, więc lokalne zmiany w forku pozostają nienaruszone."
            )"
          fi

          echo >> "${GITHUB_STEP_SUMMARY}"
          echo "⚠️ Wymagane ręczne rozwiązanie konfliktu: ${pr_url}" >> "${GITHUB_STEP_SUMMARY}"
