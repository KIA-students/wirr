name: Aktualizacja forka z KIA-students

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wirr-sync-from-kia-students
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: KIA-students/wirr
  UPSTREAM_BRANCH: main
  FALLBACK_BRANCH: sync/upstream-main

jobs:
  sync:
    if: github.repository == 'MatPomGit/wirr'
    name: Scal nowe zmiany z repozytorium nadrzędnego
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Pobierz fork z pełną historią
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Skonfiguruj Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

      - name: Sprawdź, czy KIA-students/wirr ma nowe commity
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          local_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"
          upstream_only="$(git rev-list --count "HEAD..upstream/${UPSTREAM_BRANCH}")"
          local_only="$(git rev-list --count "upstream/${UPSTREAM_BRANCH}..HEAD")"

          {
            echo "local_sha=${local_sha}"
            echo "upstream_sha=${upstream_sha}"
            echo "upstream_only=${upstream_only}"
            echo "local_only=${local_only}"
          } >> "${GITHUB_OUTPUT}"

          if [ "${upstream_only}" -gt 0 ]; then
            echo "needs_sync=true" >> "${GITHUB_OUTPUT}"
          else
            echo "needs_sync=false" >> "${GITHUB_OUTPUT}"
          fi

          {
            echo "## Synchronizacja z KIA-students/wirr"
            echo
            echo "- nowych commitów w repozytorium kursu: ${upstream_only}"
            echo "- lokalnych commitów niewystępujących upstream: ${local_only}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Brak zmian do pobrania
        if: steps.compare.outputs.needs_sync != 'true'
        shell: bash
        run: |
          echo "KIA-students/wirr nie zawiera nowych commitów względem forka."
          echo "Fork jest aktualny względem repozytorium nadrzędnego." >> "${GITHUB_STEP_SUMMARY}"

      - name: Scal upstream i zachowaj prywatną automatyzację
        if: steps.compare.outputs.needs_sync == 'true'
        id: merge
        shell: bash
        run: |
          set -euo pipefail

          local_before="$(git rev-parse HEAD)"
          private_paths=(
            ".github/workflows/sync-kia-students-pr.yml"
            ".github/workflows/sync-from-kia-students.yml"
            ".github/workflows/branch-hygiene.yml"
          )

          set +e
          git merge --no-ff --no-edit "upstream/${UPSTREAM_BRANCH}"
          merge_status=$?
          set -e

          if [ "${merge_status}" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            unhandled=0

            for path in "${conflicts[@]}"; do
              protected=false
              for private_path in "${private_paths[@]}"; do
                if [ "${path}" = "${private_path}" ]; then
                  protected=true
                  break
                fi
              done

              if [ "${protected}" = true ]; then
                echo "Rozwiązuję konflikt prywatnego workflow na korzyść forka: ${path}"
                git checkout "${local_before}" -- "${path}"
                git add "${path}"
              else
                echo "Konflikt wymagający ręcznej decyzji: ${path}"
                unhandled=1
              fi
            done

            if [ "${unhandled}" -eq 0 ]; then
              git commit --no-edit
              echo "clean=true" >> "${GITHUB_OUTPUT}"
              echo "Konflikty dotyczyły wyłącznie chronionych workflow i zostały rozwiązane lokalnie."
              exit 0
            fi

            git merge --abort || true
            echo "clean=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Automatyczne scalanie wykryło konflikt poza prywatną automatyzacją."
            exit 0
          fi

          # Nawet przy czystym merge publiczne repozytorium nie może usunąć ani
          # zastąpić workflow używanych wyłącznie w forku.
          for path in "${private_paths[@]}"; do
            if git cat-file -e "${local_before}:${path}" 2>/dev/null; then
              git checkout "${local_before}" -- "${path}"
              git add "${path}"
            fi
          done

          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi

          echo "clean=true" >> "${GITHUB_OUTPUT}"
          echo "Scalanie zakończone, a prywatna automatyzacja została zachowana."

      - name: Zaktualizuj main forka
        if: steps.compare.outputs.needs_sync == 'true' && steps.merge.outputs.clean == 'true'
        shell: bash
        run: |
          set -euo pipefail

          checked_sha="${{ steps.compare.outputs.local_sha }}"
          git fetch --no-tags origin main
          current_sha="$(git rev-parse origin/main)"

          if [ "${current_sha}" != "${checked_sha}" ]; then
            echo "::notice::Main zmienił się podczas synchronizacji. Pomijam push; kolejny zaplanowany przebieg sprawdzi nowszy stan."
            {
              echo
              echo "Synchronizacja nie wykonała push, ponieważ main otrzymał nowsze commity w trakcie tego przebiegu."
              echo "Nie jest to błąd. Kolejny przebieg wykona ponowną ocenę."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if git push origin HEAD:main; then
            echo "Main forka został zaktualizowany bez publikowania prywatnych workflow." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::notice::Push został pominięty z powodu równoległej zmiany main. Kolejny przebieg ponowi synchronizację."
            echo "Równoległa zmiana main przerwała push bez oznaczania przebiegu jako błąd." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Przygotuj bezpieczną gałąź do ręcznego rozwiązania konfliktu
        if: steps.compare.outputs.needs_sync == 'true' && steps.merge.outputs.clean == 'false'
        shell: bash
        run: |
          set -euo pipefail

          local_before="${{ steps.compare.outputs.local_sha }}"
          private_paths=(
            ".github/workflows/sync-kia-students-pr.yml"
            ".github/workflows/sync-from-kia-students.yml"
            ".github/workflows/branch-hygiene.yml"
          )

          git checkout -B "${FALLBACK_BRANCH}" "upstream/${UPSTREAM_BRANCH}"

          for path in "${private_paths[@]}"; do
            if git cat-file -e "${local_before}:${path}" 2>/dev/null; then
              git checkout "${local_before}" -- "${path}"
              git add "${path}"
            fi
          done

          if ! git diff --cached --quiet; then
            git commit -m "sync: zachowaj prywatną automatyzację forka"
          fi

          git push --force origin "HEAD:refs/heads/${FALLBACK_BRANCH}"

      - name: Utwórz lub pokaż PR przy konflikcie
        if: steps.compare.outputs.needs_sync == 'true' && steps.merge.outputs.clean == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          existing="$(
            gh pr list               --repo "${GITHUB_REPOSITORY}"               --state open               --base main               --head "${FALLBACK_BRANCH}"               --json url               --jq '.[0].url // ""'
          )"

          if [ -n "${existing}" ]; then
            pr_url="${existing}"
          else
            pr_url="$(
              gh pr create                 --repo "${GITHUB_REPOSITORY}"                 --base main                 --head "${FALLBACK_BRANCH}"                 --title "sync: aktualizacja z KIA-students/wirr"                 --body "Automatyczna synchronizacja wykryła konflikt wymagający ręcznej decyzji. Gałąź zachowuje workflow przeznaczone wyłącznie dla forka."
            )"
          fi

          echo "Wymagane ręczne rozwiązanie konfliktu: ${pr_url}" >> "${GITHUB_STEP_SUMMARY}"
