name: Synchronizacja do KIA-students

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wirr-sync-to-kia-students
  cancel-in-progress: true

env:
  UPSTREAM_REPOSITORY: KIA-students/wirr
  UPSTREAM_BRANCH: main
  EXPORT_BRANCH: sync/public-main

jobs:
  sync-pr:
    if: github.repository == 'MatPomGit/wirr'
    name: Przygotuj bezpieczny eksport i Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Pobierz repozytorium źródłowe
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Skonfiguruj Git i pobierz repozytorium publiczne
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

      - name: Zbuduj publiczny snapshot
        id: export
        shell: bash
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"

          private_paths=(
            ".github/workflows/sync-kia-students-pr.yml"
            ".github/workflows/sync-from-kia-students.yml"
            ".github/workflows/branch-hygiene.yml"
          )

          git checkout -B "${EXPORT_BRANCH}" "upstream/${UPSTREAM_BRANCH}"

          # Ustaw zawartość gałęzi eksportowej na snapshot źródłowego main.
          # HEAD nadal wskazuje publiczny upstream, więc różnica jest gotowa do PR.
          git read-tree --reset -u "${source_sha}"

          # Prywatna automatyzacja repozytoriów nie może trafić do repozytorium kursu.
          # Usuwamy ją także wtedy, gdy znalazła się tam we wcześniejszej synchronizacji.
          for path in "${private_paths[@]}"; do
            git rm -f --ignore-unmatch -- "${path}"
          done

          for path in "${private_paths[@]}"; do
            if [ -e "${path}" ]; then
              echo "::error::Prywatny workflow pozostał w eksporcie: ${path}"
              exit 1
            fi
          done

          # Blokuj publikację, jeśli publiczny snapshot zawiera nazwy repozytoriów roboczych.
          forbidden_matches="$(
            grep -RInE               --exclude-dir=.git               --binary-files=without-match               'MatPomGit/(wirr|prz)|github\.com/MatPomGit/(wirr|prz)'               . || true
          )"

          if [ -n "${forbidden_matches}" ]; then
            echo "::error::Eksport zawiera niedozwolone odwołania do repozytoriów roboczych."
            printf '%s\n' "${forbidden_matches}"
            {
              echo "## Eksport wstrzymany"
              echo
              echo "W publicznym snapshotcie wykryto odwołania, które nie powinny być publikowane."
              printf '%s\n' "${forbidden_matches}"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          if git diff --cached --quiet HEAD --; then
            echo "needs_pr=false" >> "${GITHUB_OUTPUT}"
            echo "Brak różnic w publicznej zawartości."
            exit 0
          fi

          git commit -m "sync: aktualizacja publicznego pakietu WiRR"
          export_sha="$(git rev-parse HEAD)"

          git push --force origin "HEAD:refs/heads/${EXPORT_BRANCH}"

          {
            echo "needs_pr=true"
            echo "source_sha=${source_sha}"
            echo "upstream_sha=${upstream_sha}"
            echo "export_sha=${export_sha}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## Publiczny eksport WiRR"
            echo
            echo "Przygotowano sanitizowany snapshot przeznaczony do repozytorium kursu."
            echo
            echo "- pliki prywatnej automatyzacji: wykluczone"
            echo "- odwołania do repozytoriów roboczych: brak"
            echo "- commit eksportowy: ${export_sha:0:12}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Brak zmian do publikacji
        if: steps.export.outputs.needs_pr != 'true'
        shell: bash
        run: |
          echo "Publiczna zawartość jest już zgodna z KIA-students/wirr."

      - name: Sprawdź gotowość uwierzytelnienia
        if: steps.export.outputs.needs_pr == 'true'
        id: auth
        shell: bash
        env:
          SYNC_TOKEN: ${{ secrets.KIA_STUDENTS_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_TOKEN}" ]; then
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Brak sekretu KIA_STUDENTS_SYNC_TOKEN. Wymagany jest dostęp do tworzenia Pull Requestów w KIA-students/wirr."
          else
            echo "available=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Zamknij wcześniejsze niesanitizowane Pull Requesty
        if: steps.export.outputs.needs_pr == 'true' && steps.auth.outputs.available == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.KIA_STUDENTS_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          mapfile -t legacy_prs < <(
            gh pr list \
              --repo "${UPSTREAM_REPOSITORY}" \
              --state open \
              --base "${UPSTREAM_BRANCH}" \
              --head "MatPomGit:main" \
              --json number \
              --jq '.[].number'
          )

          for pr_number in "${legacy_prs[@]}"; do
            [ -n "${pr_number}" ] || continue

            gh pr edit "${pr_number}" \
              --repo "${UPSTREAM_REPOSITORY}" \
              --title "archiwalna synchronizacja WiRR" \
              --body "Ten Pull Request został zastąpiony przez sanitizowany eksport publicznej zawartości WiRR Course Toolkit."

            gh pr close "${pr_number}" \
              --repo "${UPSTREAM_REPOSITORY}" \
              --comment "Zastąpiono bezpiecznym mechanizmem eksportu publicznej zawartości."
          done

      - name: Sprawdź istniejący Pull Request
        if: steps.export.outputs.needs_pr == 'true' && steps.auth.outputs.available == 'true'
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.KIA_STUDENTS_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          existing_url="$(
            gh pr list               --repo "${UPSTREAM_REPOSITORY}"               --state open               --base "${UPSTREAM_BRANCH}"               --head "MatPomGit:${EXPORT_BRANCH}"               --json url               --jq '.[0].url // ""'
          )"

          echo "url=${existing_url}" >> "${GITHUB_OUTPUT}"

      - name: Utwórz Pull Request do repozytorium kursu
        if: steps.export.outputs.needs_pr == 'true' && steps.auth.outputs.available == 'true' && steps.existing.outputs.url == ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.KIA_STUDENTS_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          cat > sync-pr-body.md <<'EOF'
          Automatycznie przygotowana aktualizacja publicznego pakietu WiRR Course Toolkit.

          Snapshot został sprawdzony przed utworzeniem Pull Requestu:
          - nie zawiera workflow używanych wyłącznie do synchronizacji repozytoriów;
          - nie zawiera odwołań do repozytoriów roboczych;
          - zawiera wyłącznie publiczną postać pakietu kursu.

          Po scaleniu repozytorium KIA-students/wirr nie otrzymuje mechanizmów odpowiedzialnych za synchronizację.
          EOF

          pr_url="$(
            gh pr create               --repo "${UPSTREAM_REPOSITORY}"               --base "${UPSTREAM_BRANCH}"               --head "MatPomGit:${EXPORT_BRANCH}"               --title "sync: aktualizacja WiRR Course Toolkit"               --body-file sync-pr-body.md
          )"

          echo "Utworzono PR: ${pr_url}"
          echo "Pull Request: ${pr_url}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Podsumuj istniejący Pull Request
        if: steps.export.outputs.needs_pr == 'true' && steps.auth.outputs.available == 'true' && steps.existing.outputs.url != ''
        shell: bash
        run: |
          echo "Zmiany są objęte istniejącym Pull Requestem: ${{ steps.existing.outputs.url }}" >> "${GITHUB_STEP_SUMMARY}"
