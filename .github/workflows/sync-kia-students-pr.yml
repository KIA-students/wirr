name: Synchronizacja do KIA-students

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wirr-sync-to-kia-students
  cancel-in-progress: true

env:
  UPSTREAM_REPOSITORY: KIA-students/wirr
  UPSTREAM_BRANCH: main
  SOURCE_REPOSITORY: MatPomGit/wirr
  SOURCE_BRANCH: main

jobs:
  sync-pr:
    name: Sprawdź różnice i utwórz Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Pobierz repozytorium deweloperskie
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pobierz stan repozytorium studenckiego
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

      - name: Wykryj nowe zmiany z MatPomGit/wirr
        id: diff
        shell: bash
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"
          ahead_count="$(git rev-list --count "upstream/${UPSTREAM_BRANCH}..HEAD")"
          behind_count="$(git rev-list --count "HEAD..upstream/${UPSTREAM_BRANCH}")"

          # git cherry porównuje patch-id, więc nie zgłasza ponownie commitów,
          # które trafiły już do repozytorium docelowego np. przez squash/cherry-pick.
          cherry_output="$(git cherry "upstream/${UPSTREAM_BRANCH}" HEAD || true)"
          unique_count="$(printf '%s\n' "${cherry_output}" | awk '$1 == "+" {count++} END {print count+0}')"
          equivalent_count="$(printf '%s\n' "${cherry_output}" | awk '$1 == "-" {count++} END {print count+0}')"

          {
            echo "source_sha=${source_sha}"
            echo "upstream_sha=${upstream_sha}"
            echo "ahead_count=${ahead_count}"
            echo "behind_count=${behind_count}"
            echo "unique_count=${unique_count}"
            echo "equivalent_count=${equivalent_count}"
          } >> "${GITHUB_OUTPUT}"

          if [ "${unique_count}" -gt 0 ]; then
            echo "needs_pr=true" >> "${GITHUB_OUTPUT}"
          else
            echo "needs_pr=false" >> "${GITHUB_OUTPUT}"
          fi

          echo "MatPomGit/wirr @ ${source_sha}"
          echo "KIA-students/wirr @ ${upstream_sha}"
          echo "Commity tylko w źródle: ${ahead_count}"
          echo "Commity tylko w repozytorium studenckim: ${behind_count}"
          echo "Unikalne zmiany (patch-id): ${unique_count}"
          echo "Zmiany już równoważnie obecne upstream: ${equivalent_count}"

          {
            echo "## Automatyczna synchronizacja WiRR"
            echo
            echo "Ten Pull Request został przygotowany automatycznie, ponieważ `MatPomGit/wirr:main` zawiera zmiany, których nie ma jeszcze w `KIA-students/wirr:main`."
            echo
            echo "- źródło: `MatPomGit/wirr:main` (`${source_sha:0:12}`)"
            echo "- cel: `KIA-students/wirr:main` (`${upstream_sha:0:12}`)"
            echo "- unikalne zmiany: **${unique_count}**"
            echo "- źródło jest za celem o: **${behind_count}** commit(ów)"
            echo
            echo "### Commity z unikalnymi zmianami"
            echo
            if [ "${unique_count}" -gt 0 ]; then
              printf '%s\n' "${cherry_output}" | awk '$1 == "+" {print $2}' | while read -r sha; do
                git show -s --format='- `%h` %s' "${sha}"
              done
            else
              echo "- brak"
            fi
            echo
            echo "_PR aktualizuje się automatycznie przy kolejnych zmianach w gałęzi `MatPomGit/wirr:main`._"
          } > sync-pr-body.md

      - name: Brak nowych zmian
        if: steps.diff.outputs.needs_pr != 'true'
        shell: bash
        run: |
          echo "Repozytorium deweloperskie nie zawiera nowych zmian wymagających PR do KIA-students/wirr."

      - name: Sprawdź token synchronizacji
        if: steps.diff.outputs.needs_pr == 'true'
        shell: bash
        env:
          SYNC_TOKEN: ${{ secrets.KIA_STUDENTS_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_TOKEN}" ]; then
            echo "::error::Brak sekretu KIA_STUDENTS_SYNC_TOKEN. Dodaj fine-grained PAT z dostępem do KIA-students/wirr i uprawnieniem Pull requests: Read and write."
            exit 1
          fi

      - name: Sprawdź istniejący Pull Request
        if: steps.diff.outputs.needs_pr == 'true'
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.KIA_STUDENTS_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          existing_url="$(
            gh pr list               --repo "${UPSTREAM_REPOSITORY}"               --state open               --base "${UPSTREAM_BRANCH}"               --head "MatPomGit:${SOURCE_BRANCH}"               --json url               --jq '.[0].url // ""'
          )"

          echo "url=${existing_url}" >> "${GITHUB_OUTPUT}"

          if [ -n "${existing_url}" ]; then
            echo "Istniejący PR: ${existing_url}"
          else
            echo "Brak otwartego PR synchronizacyjnego."
          fi

      - name: Utwórz Pull Request do repozytorium studenckiego
        if: steps.diff.outputs.needs_pr == 'true' && steps.existing.outputs.url == ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.KIA_STUDENTS_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          pr_url="$(
            gh pr create               --repo "${UPSTREAM_REPOSITORY}"               --base "${UPSTREAM_BRANCH}"               --head "MatPomGit:${SOURCE_BRANCH}"               --title "sync: MatPomGit/wirr → KIA-students/wirr"               --body-file sync-pr-body.md
          )"

          echo "Utworzono PR: ${pr_url}"
          echo "### Synchronizacja WiRR" >> "${GITHUB_STEP_SUMMARY}"
          echo "Utworzono Pull Request: ${pr_url}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Podsumuj istniejący Pull Request
        if: steps.diff.outputs.needs_pr == 'true' && steps.existing.outputs.url != ''
        shell: bash
        run: |
          echo "### Synchronizacja WiRR" >> "${GITHUB_STEP_SUMMARY}"
          echo "Zmiany są już objęte otwartym Pull Requestem: ${{ steps.existing.outputs.url }}" >> "${GITHUB_STEP_SUMMARY}"
